name: Pipeline CI/CD Data Storytelling

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci:
    name: Continuous Integration (CI)
    runs-on: ubuntu-latest
    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar dependências do projeto
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Executar testes com Pytest
      run: |
        # Adiciona a raiz do projeto ao PATH do Python para localizar o app/ e src/
        export PYTHONPATH="${PYTHONPATH}:."
        pytest tests/

  cd:
    name: Continuous Deployment (CD)
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        lfs: true

    - name: Configurar Git e Autenticação
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"

    - name: Fazer Deploy para o Hugging Face Spaces via Git Push
      run: |
        set -e

        git remote remove space 2>/dev/null || true
        git remote add space https://marinizeeng:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/marinizeeng/ans-complaints-insights

        # Garante que arquivos grandes/binários usem o filtro configurado
        git lfs install

        # Cria uma árvore de deploy sem o histórico do GitHub,
        # evitando enviar versões antigas dos PNGs como binários comuns.
        git checkout --orphan hf-deploy

        # Remove o índice herdado, mas preserva os arquivos no diretório de trabalho.
        git rm -rf --cached . 2>/dev/null || true

        # Reindexa os arquivos usando .gitattributes e Git LFS.
        git add -A

        git config user.email "actions@github.com"
        git config user.name "GitHub Actions"
        git commit -m "deploy: ${GITHUB_SHA}"

        # Publica somente a árvore atual no Space.
        git push --force space hf-deploy:main
